name: AirCanvas production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Verify production entrypoint
        run: |
          test -s dist/index.html
          grep -q '/assets/' dist/index.html
          test -f dist/aircanvas-mark.svg
          ! grep -R "src/main.jsx" dist/index.html

      - name: Verify generated asset references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="([^"]+)"/g)].map(m => m[1]);
          const missing = refs
            .filter(p => p.startsWith('/'))
            .map(p => p.replace(/^\//, ''))
            .filter(p => !fs.existsSync('dist/' + p));
          if (missing.length) {
            console.error('Missing production assets:', missing);
            process.exit(1);
          }
          console.log('Production assets verified:', refs);
          NODE
